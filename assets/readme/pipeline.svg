<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" role="img" aria-labelledby="pipe-title pipe-desc">
  <title id="pipe-title">The gate pipeline: classify, tamper, prove, decide</title>
  <desc id="pipe-desc">Four stages in order — the kind comes from the changed paths, tampering ends the run, proof runs in fresh worktrees, and the trust ledger picks the verdict: MERGE, RETRY or HUMAN. Settled outcomes feed back into the ledger and earn autonomy.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <rect width="1200" height="310" rx="24" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <!-- stage cards -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">
    <g transform="translate(64 64)">
      <rect width="230" height="112" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
      <text y="42" font-size="24" font-weight="700" fill="#e6edf3">classify</text>
      <text y="76" font-size="18" fill="#8b949e">kind from the</text>
      <text y="100" font-size="18" fill="#8b949e">changed paths</text>
    </g>
    <g transform="translate(336 64)">
      <rect width="230" height="112" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
      <text y="42" font-size="24" font-weight="700" fill="#e6edf3">tamper</text>
      <text y="76" font-size="18" fill="#8b949e">test tampering</text>
      <text y="100" font-size="18" fill="#8b949e">ends the run</text>
    </g>
    <g transform="translate(608 64)">
      <rect width="230" height="112" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
      <text y="42" font-size="24" font-weight="700" fill="#e6edf3">prove</text>
      <text y="76" font-size="18" fill="#8b949e">proof runs in</text>
      <text y="100" font-size="18" fill="#8b949e">fresh worktrees</text>
    </g>
    <g transform="translate(880 64)">
      <rect width="230" height="112" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
      <text y="42" font-size="24" font-weight="700" fill="#e6edf3">decide</text>
      <text y="76" font-size="18" fill="#8b949e">trust ledger</text>
      <text y="100" font-size="18" fill="#8b949e">picks the verdict</text>
    </g>
  </g>

  <!-- flow arrows -->
  <g stroke="#8b949e" stroke-width="2">
    <line x1="300" y1="120" x2="326" y2="120" marker-end="url(#arrow)"/>
    <line x1="572" y1="120" x2="598" y2="120" marker-end="url(#arrow)"/>
    <line x1="844" y1="120" x2="870" y2="120" marker-end="url(#arrow)"/>
  </g>

  <!-- verdicts -->
  <line x1="995" y1="176" x2="995" y2="208" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700" text-anchor="middle">
    <rect x="812" y="216" width="96" height="42" rx="10" fill="none" stroke="#3fb950" stroke-width="1.5"/>
    <text x="860" y="243" fill="#3fb950">MERGE</text>
    <rect x="922" y="216" width="96" height="42" rx="10" fill="none" stroke="#d29922" stroke-width="1.5"/>
    <text x="970" y="243" fill="#d29922">RETRY</text>
    <rect x="1032" y="216" width="106" height="42" rx="10" fill="none" stroke="#f85149" stroke-width="1.5"/>
    <text x="1085" y="243" fill="#f85149">HUMAN</text>
  </g>

  <!-- trust ledger feedback loop -->
  <rect x="64" y="216" width="470" height="46" rx="10" fill="none" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="299" y="245" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#8b949e" text-anchor="middle">trust ledger — outcomes earn autonomy</text>
  <path d="M 534 239 C 700 239 830 215 905 180" fill="none" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
</svg>
