<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">mergeproof — let AI agents merge, only with proof</title>
  <desc id="hero-desc">A terminal card showing a real mergeproof verdict: HUMAN for a bugfix pull request that edits an existing test, reported in shadow mode.</desc>

  <rect width="1200" height="400" rx="24" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <!-- title block -->
  <g transform="translate(64 0)">
    <text y="96" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="1" fill="#8b949e">TRUST GATE FOR AI-AGENT PULL REQUESTS</text>
    <text y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="74" font-weight="700" fill="#e6edf3">mergeproof</text>
    <text y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" fill="#c9d1d9">Let AI agents merge —</text>
    <text y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" fill="#c9d1d9">only with proof.</text>

    <!-- the frozen verdict contract -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="700" text-anchor="middle">
      <rect x="0" y="298" width="104" height="44" rx="10" fill="none" stroke="#3fb950" stroke-width="1.5"/>
      <text x="52" y="327" fill="#3fb950">MERGE</text>
      <rect x="118" y="298" width="104" height="44" rx="10" fill="none" stroke="#d29922" stroke-width="1.5"/>
      <text x="170" y="327" fill="#d29922">RETRY</text>
      <rect x="236" y="298" width="116" height="44" rx="10" fill="none" stroke="#f85149" stroke-width="1.5"/>
      <text x="294" y="327" fill="#f85149">HUMAN</text>
    </g>

    <text y="376" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#8b949e">zero deps · no LLM calls · Node ≥ 18.17</text>
  </g>

  <!-- terminal card: a real gate verdict -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22">
    <rect x="620" y="48" width="520" height="312" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <circle cx="650" cy="80" r="5.5" fill="#f85149"/>
    <circle cx="672" cy="80" r="5.5" fill="#d29922"/>
    <circle cx="694" cy="80" r="5.5" fill="#3fb950"/>

    <text x="652" y="140"><tspan fill="#3fb950">$</tspan><tspan fill="#e6edf3">&#160;mergeproof check …/pull/131</tspan></text>
    <text x="652" y="178" fill="#8b949e"><tspan>&#160;&#160;--agent claude-code --model glm</tspan></text>

    <text x="652" y="236"><tspan font-weight="700" fill="#f85149">Mergeproof — HUMAN</tspan><tspan fill="#e6edf3"> (kind: bugfix)</tspan></text>
    <text x="652" y="272" fill="#e6edf3"><tspan fill="#f85149">&#160;&#160;✗</tspan> edits existing test</text>
    <text x="652" y="306" fill="#8b949e"><tspan>&#160;&#160;&#160;&#160;tests/parser.test.js</tspan></text>
    <text x="652" y="340" fill="#8b949e"><tspan>&#160;&#160;(shadow)</tspan></text>
  </g>
</svg>
