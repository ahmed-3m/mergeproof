name: 'mergeproof'
description: >-
  Trust gate for AI-agent pull requests (zero dependencies, no LLM calls):
  `check` gates a pull request, `apply` lands a verdict a gate job wrote, and
  `sync` settles the trust ledger.
author: 'ahmed-3m'

branding:
  icon: 'shield'
  color: 'green'

inputs:
  command:
    description: 'mergeproof command: check | apply | sync | roadmap | retro'
    required: true
  args:
    description: 'Arguments for the command, space-separated. Passed through the environment and split without shell expansion.'
    required: false
    default: ''
  summary:
    description: 'Append the command output to $GITHUB_STEP_SUMMARY (for read-only display commands like retro).'
    required: false
    default: 'false'
  node-version:
    description: 'Node.js version to set up (>= 18.17)'
    required: false
    default: '22'

outputs:
  exit-code:
    description: 'mergeproof exit code — 0 MERGE, 3 RETRY, 4 HUMAN (verdicts); 2 usage error, 1 other error'
    value: ${{ steps.mergeproof.outputs.exit-code }}

runs:
  using: 'composite'
  steps:
    - name: Validate the command
      shell: bash
      env:
        MERGEPROOF_COMMAND: ${{ inputs.command }}
      run: |
        set -euo pipefail
        case "$MERGEPROOF_COMMAND" in
          check | apply | sync | roadmap | retro) ;;
          *)
            echo "::error::command must be check, apply, sync, roadmap or retro (got: $MERGEPROOF_COMMAND)"
            exit 2
            ;;
        esac

    # Pinned to the same commit as .github/workflows/ci.yml in the mergeproof repo.
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}

    # mergeproof has zero dependencies, so there is no install step: the CLI
    # runs on Node built-ins alone.
    - name: Run mergeproof
      id: mergeproof
      shell: bash
      env:
        MERGEPROOF_COMMAND: ${{ inputs.command }}
        # args arrive through the environment, never through ${{ }} inside a
        # run: script, so nothing they contain can be executed by a shell.
        MERGEPROOF_ARGS: ${{ inputs.args }}
        # summary is caller-controlled ('true'/'false' from the workflow
        # author) and read from the environment for the same reason as args.
        MERGEPROOF_SUMMARY: ${{ inputs.summary }}
      run: |
        set -euo pipefail
        # Split args into words with globbing off: no variable, glob or
        # command expansion happens on them. -d '' reads the whole variable,
        # not just its first line, and read returns 1 at the EOF it then hits.
        set -f
        read -r -d '' -a argv <<< "$MERGEPROOF_ARGS" || true
        set +f
        # summary: 'true' appends stdout to the run summary (MP-110). The
        # summary file may be unavailable outside Actions; then output stays
        # in the job log — display must never decide an outcome.
        target=''
        if [ "$MERGEPROOF_SUMMARY" = 'true' ] && [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
          target="$GITHUB_STEP_SUMMARY"
        elif [ "$MERGEPROOF_SUMMARY" = 'true' ]; then
          echo '::notice::summary requested but GITHUB_STEP_SUMMARY is unset; output stays in the job log' >&2
        fi
        code=0
        if [ -n "$target" ]; then
          node "$GITHUB_ACTION_PATH/bin/mergeproof.mjs" "$MERGEPROOF_COMMAND" "${argv[@]}" >> "$target" || code=$?
        else
          node "$GITHUB_ACTION_PATH/bin/mergeproof.mjs" "$MERGEPROOF_COMMAND" "${argv[@]}" || code=$?
        fi
        # Workflows branch on the verdict: continue-on-error the step and read
        # this output instead of guessing from failure/success.
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        exit "$code"
