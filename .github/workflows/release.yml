# Release: publish to npm, move the v1 action tag, cut the GitHub Release.
#
# Triggered only by semver tags (v0.1.0, …). The moving `v1` tag does NOT
# match the trigger glob, so force-moving it here can never start a second
# publish. A re-run of the same tag is safe: an already-published version is
# tolerated and the v1 move + release still complete.

name: release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write # move the v1 tag and create the GitHub Release
  id-token: write # npm provenance (optional; the plain publish is the fallback)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm test
      - name: Publish to npm (provenance optional, re-runs tolerated)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if npm publish --access public --provenance; then :;
          else
            echo "::warning::provenance publish failed; retrying without it"
            npm publish --access public
          fi || {
            # Both attempts failed: acceptable only when this version is
            # already on npm (a re-run of the same tag).
            if npm view "@ahmed-3m/mergeproof@$version" version >/dev/null 2>&1; then
              echo "::notice::$version is already published; continuing"
            else
              exit 1
            fi
          }
      - name: Move the v1 tag (the action templates reference ahmed-3m/mergeproof@v1)
        run: |
          set -euo pipefail
          git tag -fa v1 -m "v1 tracks the latest release"
          git push origin v1 --force
      - name: Create the GitHub Release from the changelog section
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          notes="$(node -e '
            const fs = require("fs");
            const v = process.argv[1].replace(/^v/, "");
            const s = fs.readFileSync("CHANGELOG.md", "utf8");
            const m = s.match(new RegExp("^## \\[" + v + "\\].*$\\n([\\s\\S]*?)(?=^## \\[|$)", "m"));
            process.stdout.write(m ? m[1].trim() : "");
          ' "$TAG")"
          gh release create "$TAG" --title "$TAG" --notes "$notes" || echo "release for $TAG already exists"
