version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # One weekly PR for every action bump instead of one PR (and branch) each.
    groups:
      actions:
        patterns: ['*']
    # Self-hosted mergeproof pins are managed by scripts/promote.mjs (which
    # also updates env.MERGEPROOF_REF in mergeproof-issue.yml and the headers).
    ignore:
      - dependency-name: 'ahmed-3m/mergeproof'
